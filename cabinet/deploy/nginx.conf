worker_processes 1;
error_log stderr warn;
pid /tmp/taptrack-cabinet-nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log stderr;
    sendfile on;
    keepalive_timeout 15;
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    server {
        listen 5177;
        server_name _;
        root /home/taptrack/tap-track/cabinet/dist;
        index index.html;

        location ^~ /nfc-bridge/ {
            proxy_pass http://127.0.0.1:5001/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-TapTrack-Workflow-Authorization "";
            proxy_set_header X-TapTrack-Ingress-Age "";
            proxy_set_header X-TapTrack-Ingress-Forwarded-At "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;
        }

        location ~ ^/api/access-logs/[0-9]+/photo(/image)?/$ {
            limit_except GET {
                deny all;
            }
            set $django_api_host taptrack-api.onrender.com;
            proxy_pass https://$django_api_host$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name $django_api_host;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_set_header Host $django_api_host;
            include /run/taptrack-cabinet/cabinet-device-key.conf;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
        }

        location /api/ {
            set $django_api_host taptrack-api.onrender.com;
            proxy_pass https://$django_api_host$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name $django_api_host;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_set_header Host $django_api_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_next_upstream off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}