# Include inside the authenticated HTTPS Cabinet server.
# The protected header include sets only X-TapTrack-Workflow-Authorization.
location = /nfc-bridge/cabinet/workflow {
    if ($scheme != https) { return 403; }

    include /etc/taptrack/nginx/kiosk-access.conf;

    client_max_body_size 4k;
    proxy_request_buffering on;
    proxy_pass http://127.0.0.1:5001/cabinet/workflow;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_set_header X-TapTrack-Ingress-Age $request_time;
    proxy_set_header X-TapTrack-Ingress-Forwarded-At $msec;
    include /etc/taptrack/nginx/workflow-proxy-header.conf;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
}
