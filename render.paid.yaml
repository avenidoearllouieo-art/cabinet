services:
  - type: web
    name: taptrack-api
    runtime: python
    rootDir: .
    plan: 0.5c-512mb
    buildCommand: bash backend/build.sh
    preDeployCommand: python backend/manage.py migrate --noinput
    startCommand: mkdir -p "${DJANGO_FILE_UPLOAD_TEMP_DIR:-/var/data/tmp}" && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    disk:
      name: taptrack-media
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taptrack-postgres
          property: connectionString
      - key: DJANGO_MEDIA_STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        value: taptrack-files
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_ENDPOINT_URL
        value: https://t3.storage.dev
      - key: AWS_S3_ADDRESSING_STYLE
        value: virtual
      - key: TAPTRACK_MAX_STUDENT_VIDEO_BYTES
        value: "5368709120"
      - key: TAPTRACK_MAX_STUDENT_SUBMISSION_BYTES
        value: "10737418240"
      - key: TAPTRACK_MULTIPART_PART_SIZE
        value: "33554432"
      - key: TAPTRACK_MULTIPART_SESSION_TTL
        value: "86400"
      - key: TAPTRACK_PRESIGNED_PART_URL_TTL
        value: "900"
      - key: DJANGO_LEGACY_MEDIA_ROOT
        value: /var/data/media
      - key: DJANGO_FILE_UPLOAD_TEMP_DIR
        value: /var/data/tmp
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TAPTRACK_NFC_REGISTRATION_URL_BASE
        sync: false
      - key: TAPTRACK_NFC_DEVICE_MAP
        sync: false

  - type: web
    name: taptrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: taptrack-postgres
