services:
  - type: web
    name: taptrack-api
    runtime: python
    rootDir: .
    plan: free
    buildCommand: bash backend/build.sh
    startCommand: mkdir -p "${DJANGO_FILE_UPLOAD_TEMP_DIR:-/tmp/taptrack-tmp}" && python backend/manage.py migrate --noinput && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taptrack-postgres
          property: connectionString
      - key: DJANGO_MEDIA_STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        value: taptrack-files
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_ENDPOINT_URL
        value: https://t3.storage.dev
      - key: AWS_S3_ADDRESSING_STYLE
        value: virtual
      - key: TAPTRACK_MAX_STUDENT_VIDEO_BYTES
        value: "5368709120"
      - key: TAPTRACK_MAX_STUDENT_SUBMISSION_BYTES
        value: "10737418240"
      - key: TAPTRACK_MULTIPART_PART_SIZE
        value: "33554432"
      - key: TAPTRACK_MULTIPART_SESSION_TTL
        value: "86400"
      - key: TAPTRACK_PRESIGNED_PART_URL_TTL
        value: "900"
      - key: DJANGO_LEGACY_MEDIA_ROOT
        value: /tmp/taptrack-media
      - key: DJANGO_FILE_UPLOAD_TEMP_DIR
        value: /tmp/taptrack-tmp
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TAPTRACK_NFC_REGISTRATION_URL_BASE
        sync: false
      - key: DJANGO_EMAIL_HOST
        sync: false
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_EMAIL_USE_TLS
        value: "true"
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
      - key: TAPTRACK_NFC_DEVICE_MAP
        sync: false

  - type: web
    name: taptrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://taptrack-api.onrender.com/api

databases:
  - name: taptrack-postgres
    plan: free