services:
  - type: web
    name: taptrack-api
    runtime: python
    rootDir: .
    plan: free
    buildCommand: bash backend/build.sh
    startCommand: python backend/manage.py migrate --noinput && mkdir -p "${DJANGO_MEDIA_ROOT:-/tmp/taptrack-media}" "${DJANGO_FILE_UPLOAD_TEMP_DIR:-/tmp/taptrack-tmp}" && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taptrack-postgres
          property: connectionString
      - key: DJANGO_MEDIA_ROOT
        value: /tmp/taptrack-media
      - key: DJANGO_FILE_UPLOAD_TEMP_DIR
        value: /tmp/taptrack-tmp
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TAPTRACK_NFC_REGISTRATION_URL_BASE
        sync: false
      - key: TAPTRACK_NFC_DEVICE_MAP
        sync: false

  - type: web
    name: taptrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: taptrack-postgres
    plan: free